name: Verify Kesit Istatistik
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'ders/**'
      - 'tools/**'
      - 'sitemap.xml'
      - 'verify*.cjs'
      - 'vaka/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'ders/**'
      - 'tools/**'
      - 'sitemap.xml'
      - 'verify*.cjs'
      - 'vaka/**'
      - '.github/workflows/verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          find docs -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate curriculum and examples
        run: node verify.cjs
      - name: Validate exercise calculations
        run: node verify-engine.cjs
      - name: Validate warehouse case (vaka/depo)
        run: node verify-vaka.cjs
      - name: Validate learning graphics and interactive references
        run: node verify-visual.cjs
      - name: Validate learning feedback and decision workflow
        run: node verify-quality.cjs
      - name: Validate V9 ecosystem cases, practice generators and interview content
        run: node verify-v9.cjs
      - name: Check generated lesson pages are up to date
        run: |
          node tools/ders-sayfalari.mjs
          # sitemap.xml lastmod her çalıştırmada bugünün tarihini alır; yalnızca adres listesini karşılaştır
          git show HEAD:sitemap.xml | grep -o '<loc>[^<]*</loc>' > /tmp/sitemap-onceki.txt
          grep -o '<loc>[^<]*</loc>' sitemap.xml > /tmp/sitemap-yeni.txt
          diff -u /tmp/sitemap-onceki.txt /tmp/sitemap-yeni.txt || { echo '::error::sitemap.xml adresleri güncel değil: node tools/ders-sayfalari.mjs çalıştırıp commit et'; exit 1; }
          git diff --exit-code -- ders || { echo '::error::ders/ sayfaları docs/content.js ile uyumsuz: node tools/ders-sayfalari.mjs çalıştırıp commit et'; exit 1; }
          if [ -n "$(git ls-files --others --exclude-standard -- ders)" ]; then echo '::error::ders/ altında commit edilmemiş üretilmiş sayfa var'; git ls-files --others --exclude-standard -- ders; exit 1; fi
